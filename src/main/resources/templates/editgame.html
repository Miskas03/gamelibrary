<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <title>Edit Game</title>
</head>

<body>
    <h1>Edit Game</h1>
    <form th:action="@{/admin/games/edit/{id}(id=${game.id})}" th:object="${game}" method="post">

        <div>
            <label for="name">Name: <input type="text" th:field="*{name}" required></label>
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            <label for="info">Info: <input type="text" th:field="*{info}" required></label>
            <span th:if="${#fields.hasErrors('info')}" th:errors="*{info}"></span>
        </div>

        <div>
            <label for="developer">Developer:</label>
            <select th:field="*{developer}">
                <option th:each="developer : ${developers}" th:value="${developer.id}" th:text="${developer.name}">
                </option>
            </select>
        </div>

        <div>
            <details>
                <summary>Choose genres</summary>
                <label th:each="genre : ${genres}">
                    <input type="checkbox" th:text="${genre.name}" th:value="${genre.id}" th:field="*{genres}">
                </label>
            </details>


            <details>
                <summary>Choose platforms</summary>
                <label th:each="platform : ${platforms}">
                    <input type="checkbox" th:text="${platform.name}" th:value="${platform.id}" th:field="*{platforms}">
                </label>
            </details>
        </div>

        <div>
            <label for="releaseDate">Release date</label>
            <input type="date" id="releaseDate" th:field="*{releaseDate}" />
        </div>

        <!--Piilokenttä vie pelin id:n mukana,
         jotta päivitetään vanha peli eikä luoda uutta-->
        <input type="hidden" th:field="*{id}">
        <button type="submit">Save</button>
        <a th:href="@{/games}">Cancel</a>

    </form>

</body>

</html>
