<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>Games</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    
</head>

<body>

    <form th:action="@{/games}" method="get">
        <button type="get">Back to Games</button>
    </form>

    <!-- Kirjautumis nappi näkyvissä jos ei ole kirjautunut sisään-->
    <form sec:authorize="!isAuthenticated()" th:action="@{/login}" method="get">
        <input type ="submit" value="Sign in"/>
    </form>

    <!-- Uloskirjautumis nappi näkyvissä jos on kirjautunut sisään-->
    <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
        <input type="submit" value="Sign out"/>
        </form>

    <h1 th:text="${game.name}">Game Info</h1>
    <table cellpadding="10">

        <thead>
            <tr>
                
                <th>Info</th>
                <th>Developer</th>
                <th>Release Date</th>
                <th>Genre</th>
                <th>Platform</th>
            </tr>
        </thead>


        <tbody>
            <tr>
                
                <td th:text="${game.info}"></td>
                <td th:text="${game.developer?.name}"></td>
                <td th:text="${game.releaseDate}"></td>

                <td> <!-- Tässä käydään genres listalta läpi genret jotta löydetään kaikki pelin genret -->
                    <span th:each="genre : ${game.genres}" th:text="${genre.name} + ' '"></span>
                </td>

                <td>
                    <span th:each="platform : ${game.platforms}" th:text="${platform.name} + ' '"></span>
                </td>
                <td>
                    <!-- Pelin muokkaus nappi jos on kirjautunut sisään admin käyttäjällä-->
                    <form sec:authorize="hasAuthority('ADMIN')" th:action="@{/admin/games/edit/{id}(id=${game.id})}"
                    method="get">
                    <button type="submit">Edit</button>
                </form>
                </td>
                <td>
                    <!-- Pelin poisto nappi jos on kirjautunut sisään admin käyttäjällä-->
                <form sec:authorize="hasAuthority('ADMIN')" th:action="@{/admin/games/delete/{id}(id=${game.id})}"
                    method="post">
                    <button type="submit">Delete</button>
                </form>
                </td>
            </tr>


        </tbody>

    </table>
</body>

</html>
