<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <title>AddGame</title>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />


</head>

<body>

    <form th:action="@{/games}" method="get">
        <button type="submit">Back to Games</button>
    </form>
    <h2>Add game</h2>
    <form th:object="${game}" th:action="@{/admin/games/savegame}" method="post">

        <label for="name">Name</label>
        <input type="text" id="name" th:field="*{name}" />

        <label for="info">Info</label>
        <input type="text" id="info" th:field="*{info}" />

        <label for="developer">Developer</label>
        <select th:field="*{developer}">
            <option th:each="developer : ${developers}" th:value="${developer.id}" th:text="${developer.name}"></option>
        </select>

        <label for="genre">Genres:
            <input type="checkbox" th:each="genre : ${genres}" th:text="${genre.name}" th:value="${genre.id}"
                th:field="*{genres}">
        </label>

        <label for="platform">Platforms:
            <input type="checkbox" th:each="platform : ${platforms}" th:text="${platform.name}"
                th:value="${platform.id}" th:field="*{platforms}">
        </label>


        <label for="releaseDate">Release date</label>
        <input type="date" id="releaseDate" th:field="*{releaseDate}" class="form-control" />

        <input type="submit" value="Save">
    </form>
</body>
