<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title>AddGame</title>
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />


</head>

<body>


    <form th:action="@{/games}" method="get">
        <button type="submit">Back to Games</button>
    </form>
    <h2>Add game</h2>
    <form th:object="${game}" th:action="@{/admin/games/savegame}" method="post">


        <div>
            <label for="name">Name</label>
            <input type="text" id="name" th:field="*{name}" required />
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

            <label for="info">Info</label>
            <input type="text" id="info" th:field="*{info}" required />
            <span th:if="${#fields.hasErrors('info')}" th:errors="*{info}"></span>

        </div>
        <div>
            <label for="developer">Developer</label>
            <select th:field="*{developer}">
                <option th:each="developer : ${developers}" th:value="${developer.id}" th:text="${developer.name}">
                </option>
            </select>
        </div>
        <div>
            <details>
                <summary>Choose genres</summary>
                <label th:each="genre : ${genres}">
                    <input type="checkbox" th:text="${genre.name}" th:value="${genre.id}" th:field="*{genres}">
                </label>
            </details>


            <details>
                <summary>Choose platforms</summary>
                <label th:each="platform : ${platforms}">
                    <input type="checkbox" th:text="${platform.name}" th:value="${platform.id}" th:field="*{platforms}">
                </label>
            </details>
        </div>
        <div>
            <label for="releaseDate">Release date</label>
            <input type="date" id="releaseDate" th:field="*{releaseDate}" class="form-control" />

            <div>
                <input type="submit" value="Save">
                <a th:href="@{/games}">Cancel</a>
            </div>
        </div>
    </form>


</body>
</html>
