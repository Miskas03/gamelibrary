<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Games</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <form th:action="@{/admin/games/addgame}" method="get">
            <button type="get">Add game</button>
        </form>
</head>

<body>

    <h1 th:text="'Game library'">Game library</h1>
    <table cellpadding="10">

        <thead>
            <tr>
                <th>Game</th>
                <th>Info</th>
                <th>Developer</th>
                <th>Release Date</th>
                <th>Genre</th>
                <th>Platform</th>
            </tr>
        </thead>


        <tbody>
            <tr th:each="game : ${games}">
                <td><a th:href="@{/games/{id}(id=${game.id})}" th:text="${game.name}"></a></td>
                <td th:text="${game.info}"></td>
                <td th:text="${game.developer.name}"></td>
                <td th:text="${game.releaseDate}"></td>

                <td>    <!-- Tässä käydään genres listalta läpi genret jotta löydetään kaikki pelin genret, -->
                    <span th:each="genre : ${game.genres}" th:text="${genre.name} + ' '"></span>
                </td>

                <td>
                    <span th:each="platform : ${game.platforms}" th:text="${platform.name} + ' '"></span>
                </td>
            </tr>


        </tbody>

    </table>
</body>

</html>
