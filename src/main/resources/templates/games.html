<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Games</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>

<body>

    <h1 th:text="'Game library'">Game library</h1>
    <table cellpadding="10">


        <tbody>
            <tr th:each="game : ${games}">
                <td th:text="${game.name}"></td>
                <td th:text="${game.info}"></td>
                <td th:text="${game.developer.name}"></td>
                <td th:text="${game.releaseDate}"></td>

                <td>    <!-- Tässä käydään genres listalta läpi genret jotta löydetään kaikki pelin genret, -->
                        <!--   samalla tavalla kuin alussa käydään läpi games lista-->
                    <span th:each="genre : ${game.genres}" th:text="${genre.name} + ' '"></span>
                </td>

                <td>
                    <span th:each="platform : ${platforms}" th:text="${platform.name} + ' '"></span>
                </td>
            </tr>


        </tbody>

    </table>
</body>

</html>
